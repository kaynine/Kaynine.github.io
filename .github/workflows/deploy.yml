name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 15 * * *'  # 매일 자정 KST (UTC 15:00)
    - cron: '0 3 * * *'   # 매일 정오 KST (UTC 03:00)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          DATABASE_ID_CUSTOMIZING: ${{ secrets.DATABASE_ID_CUSTOMIZING }}
          DATABASE_ID_CODENODE: ${{ secrets.DATABASE_ID_CODENODE }}
          DATABASE_ID_DEBUGGING: ${{ secrets.DATABASE_ID_DEBUGGING }}
        run: |
          for i in 1 2 3; do
            npm run build && break
            echo "Build attempt $i failed, retrying in 20s..."
            sleep 20
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
